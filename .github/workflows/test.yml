name: test

on:
  push:
    branches: ['**']  # all branches, not tags (tag pushes are handled by publish.yml)
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          # the lingam extra carries a python_version < "3.13" marker, so this
          # installs it up to 3.12 and is a no-op on 3.13/3.14
          pip install -e .[lingam,testdata]
          pip install pytest
      - name: Require the lingam tests where the extra resolves
        # lingam pins scipy<=1.13.1 (its semopy dependency needs the removed
        # scipy.stats.mvn.mvnun) and that scipy has no wheel for Python >= 3.13,
        # so 3.13/3.14 legitimately skip. Below that the extra really is
        # installed, so a skip there would hide a broken install: fail instead.
        # (testdata is installed above only to prove the extra resolves -- no
        # test exercises Hawkes yet, so there is nothing to gate on.)
        if: matrix.python-version != '3.13' && matrix.python-version != '3.14'
        run: echo "LINGAM_REQUIRED=1" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: pytest tests/ --ignore=tests/integration

  integration:
    runs-on: ubuntu-latest
    services:
      influxdb-v1:
        image: influxdb:1.8
        ports:
          - 8086:8086
        env:
          INFLUXDB_HTTP_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package and integration deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[influx]
          pip install pytest
      - name: Run integration and contract tests (incl. influx backend)
        run: pytest tests/integration tests/contract
