name: test

on:
  push:
    branches: ['**']  # all branches, not tags (tag pushes are handled by publish.yml)
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run unit tests
        run: pytest tests/ --ignore=tests/integration

  integration:
    runs-on: ubuntu-latest
    services:
      influxdb-v1:
        image: influxdb:1.8
        ports:
          - 8086:8086
        env:
          INFLUXDB_HTTP_AUTH_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and integration deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .[influx]
          pip install pytest
      - name: Run integration and contract tests (incl. influx backend)
        run: pytest tests/integration tests/contract
