# Optional local InfluxDB for the opt-in integration tests in tests/integration/.
# Not required for the normal (unit) test run.
#
#   docker compose up -d        # start InfluxDB v1.8 on localhost:8086
#   pip install -e .[influx]    # InfluxDB v1 client (optional extra)
#   pytest tests/integration    # run the integration tests
#   docker compose down         # stop and remove
#
# The same images are used by the `integration` job in
# .github/workflows/test.yml as service containers. Services are named per
# InfluxDB major version so multiple versions can run side by side as the
# project migrates (v1 -> v3); each uses its own host port.

services:
  influxdb-v1:
    image: influxdb:1.8
    container_name: logdag-influxdb-v1-test
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_HTTP_AUTH_ENABLED: "false"

  # InfluxDB v3 (Core) for the future v3 backend; runs alongside v1 on its own port.
  # Verified working dev startup (heinzel, 2026-06-19, image influxdb:3-core):
  #   `serve --node-id node0 --object-store memory --without-auth` -> /health 200 in ~3s;
  #   write POST /api/v3/write_lp?db=<db> (204), query GET /api/v3/query_sql?db=<db>&q=<SQL>&format=csv (200).
  #   v3 also supports InfluxQL natively (/api/v3/query_influxql). SQL is the primary query API.
  # `--object-store memory` = ephemeral (fresh DB each start, ideal for per-round test isolation);
  # `--without-auth` = no token, DEV ONLY. No in-container healthcheck (curl may be absent in the image);
  # callers wait on the host: `until curl -sf http://localhost:8181/health; do sleep 1; done`.
  influxdb-v3:
    image: influxdb:3-core
    container_name: logdag-influxdb-v3-test
    command: influxdb3 serve --node-id node0 --object-store memory --without-auth
    ports:
      - "8181:8181"
