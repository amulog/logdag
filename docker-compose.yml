# Optional local InfluxDB for the opt-in integration tests in tests/integration/.
# Not required for the normal (unit) test run.
#
#   docker compose up -d        # start InfluxDB v1.8 on localhost:8086
#   pip install influxdb        # client (not a runtime dependency of logdag)
#   pytest tests/integration    # run the integration tests
#   docker compose down         # stop and remove
#
# The same images are used by the `integration` job in
# .github/workflows/test.yml as service containers. Services are named per
# InfluxDB major version so multiple versions can run side by side as the
# project migrates (v1 -> v3); each uses its own host port.

services:
  influxdb-v1:
    image: influxdb:1.8
    container_name: logdag-influxdb-v1-test
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_HTTP_AUTH_ENABLED: "false"

  # InfluxDB v3 (Core) -- prepared for the future v3 backend; runs alongside v1
  # on its own port. Uncomment and VERIFY against the current InfluxDB 3 Core
  # docs when implementing the backend: v3 differs from v1 (SQL / FlightSQL
  # instead of InfluxQL, a separate client, an object store, default port 8181,
  # and token auth), so the command/auth below may need adjusting.
  # influxdb-v3:
  #   image: influxdb:3-core
  #   container_name: logdag-influxdb-v3-test
  #   command: influxdb3 serve --node-id node0 --object-store memory
  #   ports:
  #     - "8181:8181"
