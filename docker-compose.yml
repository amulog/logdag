# Optional local InfluxDB 1.8 for the opt-in integration tests in
# tests/integration/. Not required for the normal (unit) test run.
#
#   docker compose up -d        # start InfluxDB 1.8 on localhost:8086
#   pip install influxdb        # client (not a runtime dependency of logdag)
#   pytest tests/integration    # run the integration tests
#   docker compose down         # stop and remove
#
# The same image is used by the `integration` job in
# .github/workflows/test.yml as a service container.

services:
  influxdb:
    image: influxdb:1.8
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
